[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "satya-engine"
version = "2.0.0"
description = "Evidence-led procurement reconciliation engine"
requires-python = ">=3.11"
dependencies = [
  "fastapi==0.116.1",
  "uvicorn==0.35.0",
  "pydantic==2.11.7",
  "numpy==2.0.2",
  "scipy==1.14.1",
  "scikit-learn==1.5.2",
  "xgboost-cpu==2.1.4",
]

[tool.hatch.build]
include = ["satya_engine/**"]

[tool.hatch.build.targets.wheel]
packages = ["satya_engine"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:cacheprovider"
