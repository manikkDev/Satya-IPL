services:
  neo4j:
    image: neo4j:5.26-community
    environment:
      NEO4J_AUTH: neo4j/password
      NEO4J_PLUGINS: '["graph-data-science"]'
      NEO4J_dbms_security_procedures_unrestricted: gds.*
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4j_data:/data
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p password 'RETURN 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s

  mongo:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10

  ml-fl-service:
    build: ./ml-fl-service
    env_file:
      - path: ./ml-fl-service/.env
        required: false
    environment:
      PORT: 8000
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: password
      PROGRESS_WEBHOOK: http://server:5002/api/fl/progress
      # env_file carries a host-local FLOWER_PYTHON path that does not exist
      # inside the container; an empty override makes the runner fall back to
      # the container interpreter (/usr/local/bin/python, space-free).
      FLOWER_PYTHON: ""
    ports:
      - "8000:8000"
    volumes:
      - ./ml-fl-service/data:/app/data
      - ./ml-fl-service/runs:/app/runs
    depends_on:
      neo4j:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 10

  server:
    build: ./server
    env_file:
      - ./server/.env
    environment:
      NODE_ENV: production
      PORT: 5002
      MONGO_URI: ""
      DB_URI: ${COMPOSE_DB_URI:-mongodb://mongo:27017/arth_saathi}
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: password
    ports:
      - "5002:5002"
    depends_on:
      mongo:
        condition: service_healthy
      neo4j:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:5002/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10

  chatbot-backend:
    build: ./chatbot-backend
    env_file:
      - ./chatbot-backend/.env
    environment:
      NODE_ENV: production
      PORT: 5001
      ML_API_URL: http://ml-fl-service:8000
      GRAPH_API_URL: http://server:5002
    ports:
      - "5001:5001"
    depends_on:
      ml-fl-service:
        condition: service_healthy
      server:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:5001/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10

  client:
    build:
      context: ./client
      args:
        NEXT_PUBLIC_MAIN_API_URL: http://localhost:5001
        NEXT_PUBLIC_GRAPH_API_URL: http://localhost:5002
        NEXT_PUBLIC_ML_API_URL: http://localhost:8000
    environment:
      PORT: 3000
      NEXT_PUBLIC_MAIN_API_URL: http://localhost:5001
      NEXT_PUBLIC_GRAPH_API_URL: http://localhost:5002
      NEXT_PUBLIC_ML_API_URL: http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      chatbot-backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  neo4j_data:
  mongo_data:
