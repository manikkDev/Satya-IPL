services:
  neo4j:
    image: neo4j:5.26-community
    mem_limit: 1.5g
    cpus: 1
    environment:
      NEO4J_AUTH: neo4j/password
      NEO4J_PLUGINS: '["graph-data-science"]'
      NEO4J_dbms_security_procedures_unrestricted: gds.*
      NEO4J_server_memory_heap_max__size: 512m
      NEO4J_server_memory_pagecache_size: 256m
    ports:
      - "127.0.0.1:7474:7474"
      - "127.0.0.1:7687:7687"
    volumes:
      - neo4j_data:/data
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p password 'RETURN 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s

  mongo:
    image: mongo:7
    mem_limit: 1g
    cpus: 1
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10

  ml-fl-service:
    build: ./ml-fl-service
    mem_limit: 2g
    cpus: 2
    env_file:
      - path: ./ml-fl-service/.env
        required: false
    environment:
      PORT: 8000
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: password
      # Local dev only: expose the engine's additive v2 endpoints (tax
      # compute, gstin validate, reconcile). Production keeps this unset
      # until launch — render.yaml has no FEATURE_V2_* keys.
      FEATURE_V2_RECON_V2: "1"
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./ml-fl-service/data:/app/data
      - ./ml-fl-service/runs:/app/runs
    depends_on:
      neo4j:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 10

  server:
    build: ./server
    mem_limit: 768m
    cpus: 1
    env_file:
      - ./server/.env
    environment:
      NODE_ENV: production
      PORT: 5002
      MONGO_URI: ""
      DB_URI: mongodb://mongo:27017/satya
      APP_DB_NAME: satya
      DEMO_MODE: "1"
      ENGINE_API_URL: http://ml-fl-service:8000
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: password
    ports:
      - "127.0.0.1:5002:5002"
    depends_on:
      ml-fl-service:
        condition: service_healthy
      mongo:
        condition: service_healthy
      neo4j:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:5002/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10

  chatbot-backend:
    build: ./chatbot-backend
    mem_limit: 768m
    cpus: 1
    env_file:
      - ./chatbot-backend/.env
    environment:
      NODE_ENV: production
      PORT: 5001
      ML_API_URL: http://ml-fl-service:8000
      GRAPH_API_URL: http://server:5002
    ports:
      - "127.0.0.1:5001:5001"
    depends_on:
      ml-fl-service:
        condition: service_healthy
      server:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:5001/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10

  client:
    mem_limit: 1.5g
    cpus: 2
    build:
      context: ./client
      args:
        NEXT_PUBLIC_MAIN_API_URL: http://localhost:5001
        NEXT_PUBLIC_GRAPH_API_URL: http://localhost:5002
        NEXT_PUBLIC_ML_API_URL: http://localhost:8000
        NEXT_PUBLIC_APP_V2: "1"
    environment:
      PORT: 3000
      NEXT_PUBLIC_MAIN_API_URL: http://localhost:5001
      NEXT_PUBLIC_GRAPH_API_URL: http://localhost:5002
      NEXT_PUBLIC_ML_API_URL: http://localhost:8000
      NEXT_PUBLIC_APP_V2: "1"
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      chatbot-backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  neo4j_data:
  mongo_data:
